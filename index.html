<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<!-- Gabarit web d'Infinity Forge (préréglage d'export « Web », html/custom_html_shell).
		     Basé sur le gabarit Godot 4.7, avec : écran de chargement or et nuit, plein écran sous
		     l'encoche (viewport-fit=cover, marges transmises au jeu par window.ifSafeArea), message en
		     cas de perte de l'affichage WebGL, et mise à jour du jeu installé (PWA). -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#090b16">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>Infinity Forge</title>
		<style>
:root {
	--nuit: #090b16;
	--nuit-2: #141a33;
	--or: #c9aa70;
	--or-clair: #f0d79a;
	--ivoire: #f5eddf;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background-color: var(--nuit);
}

body {
	color: var(--ivoire);
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	font-family: Georgia, 'Times New Roman', serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Sonde des marges de sécurité (encoche, barre d'accueil), lue par window.ifSafeArea(). */
#if-safe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 50% 45%, #232c52 0%, var(--nuit-2) 55%, var(--nuit) 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 22px;
	visibility: hidden;
}

#status-splash {
	width: 96px;
	height: 96px;
	border-radius: 22px;
	box-shadow: 0 0 0 1px rgba(201, 170, 112, 0.6), 0 0 28px rgba(201, 170, 112, 0.25);
}

#status-splash.show-image--false {
	display: none;
}

#status-title {
	color: var(--or-clair);
	font-size: 28px;
	letter-spacing: 0.18em;
	text-transform: uppercase;
	text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}

#status-progress {
	display: none;
	width: min(52vw, 420px);
	height: 6px;
	border-radius: 3px;
	background: rgba(201, 170, 112, 0.16);
	box-shadow: inset 0 0 0 1px rgba(201, 170, 112, 0.45);
	overflow: hidden;
}

#status-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #9c7d45, var(--or-clair), var(--or));
	transition: width 0.2s linear;
}

#status-bar.indeterminate {
	width: 30%;
	animation: if-slide 1.4s ease-in-out infinite;
}

@keyframes if-slide {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-label {
	display: none;
	font-size: 15px;
	letter-spacing: 0.08em;
	color: rgba(245, 237, 223, 0.7);
}

#status-notice {
	display: none;
}

/* Fenêtres HTML (erreur, perte d'affichage, mise à jour) au kit or et nuit. */
.if-panel {
	max-width: min(86vw, 560px);
	padding: 22px 28px;
	border-radius: 14px;
	background: linear-gradient(180deg, rgba(29, 36, 70, 0.97), rgba(12, 15, 31, 0.97));
	box-shadow: 0 0 0 1px rgba(201, 170, 112, 0.75), 0 0 0 4px rgba(9, 11, 22, 0.9), 0 0 0 5px rgba(201, 170, 112, 0.35), 0 12px 40px rgba(0, 0, 0, 0.6);
	color: var(--ivoire);
	font-size: 17px;
	line-height: 1.45;
	text-align: center;
}

.if-panel strong {
	display: block;
	margin-bottom: 8px;
	color: var(--or-clair);
	font-size: 20px;
	letter-spacing: 0.06em;
}

.if-actions {
	display: flex;
	gap: 12px;
	justify-content: center;
	margin-top: 16px;
}

.if-button {
	min-height: 44px;
	min-width: 132px;
	padding: 0 20px;
	border: 0;
	border-radius: 10px;
	font: inherit;
	font-size: 16px;
	letter-spacing: 0.05em;
	cursor: pointer;
	color: #241a08;
	background: linear-gradient(180deg, #f3dca2, #c9a462 55%, #a8843f);
	box-shadow: 0 0 0 1px #6e5626, inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.if-button.secondary {
	color: var(--ivoire);
	background: linear-gradient(180deg, #232c52, #141a33);
	box-shadow: 0 0 0 1px rgba(201, 170, 112, 0.7);
}

#if-lost {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	align-items: center;
	justify-content: center;
	background: rgba(9, 11, 22, 0.94);
}

#if-update {
	position: fixed;
	z-index: 10;
	top: calc(env(safe-area-inset-top, 0px) + 12px);
	left: 50%;
	transform: translateX(-50%);
	display: none;
	padding: 14px 20px;
}

#if-update .if-actions {
	margin-top: 10px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Votre navigateur ne gère pas l'affichage de ce jeu.
		</canvas>

		<noscript>
			JavaScript est nécessaire pour jouer à Infinity Forge.
		</noscript>

		<div id="if-safe"></div>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<div id="status-title">Infinity Forge</div>
			<div id="status-progress"><div id="status-bar"></div></div>
			<div id="status-label">Chargement…</div>
			<div id="status-notice" class="if-panel"></div>
		</div>

		<div id="if-lost">
			<div class="if-panel">
				<strong>Affichage interrompu</strong>
				L'appareil a repris la mémoire graphique du jeu (application en arrière-plan ou mémoire saturée).
				<div class="if-actions">
					<button class="if-button" id="if-lost-reload" type="button">Relancer le jeu</button>
				</div>
			</div>
		</div>

		<div id="if-update" class="if-panel" role="alertdialog" aria-live="polite">
			<strong>Nouvelle version disponible</strong>
			Mettre à jour relance le jeu (une partie en cours sera interrompue).
			<div class="if-actions">
				<button class="if-button" id="if-update-now" type="button">Mettre à jour</button>
				<button class="if-button secondary" id="if-update-later" type="button">Plus tard</button>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11853296,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Marges de sécurité en fraction de la taille de la page (gauche, haut, droite, bas), lues par
// SafeAreaContainer via JavaScriptBridge : indépendantes de la densité de pixels de l'écran.
window.ifSafeArea = function () {
	const probe = document.getElementById('if-safe');
	const s = window.getComputedStyle(probe);
	const w = Math.max(window.innerWidth, 1);
	const h = Math.max(window.innerHeight, 1);
	return JSON.stringify({
		l: (parseFloat(s.paddingLeft) || 0) / w,
		t: (parseFloat(s.paddingTop) || 0) / h,
		r: (parseFloat(s.paddingRight) || 0) / w,
		b: (parseFloat(s.paddingBottom) || 0) / h,
	});
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const title = document.createElement('strong');
		title.textContent = 'Le jeu ne peut pas démarrer';
		statusNotice.appendChild(title);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Erreur inconnue. Rechargez la page.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// --- Perte du contexte WebGL (iOS reprend la mémoire graphique) : écran noir sans cela. ---
	const lost = document.getElementById('if-lost');
	canvas.addEventListener('webglcontextlost', (event) => {
		event.preventDefault();
		lost.style.display = 'flex';
	}, false);
	document.getElementById('if-lost-reload').addEventListener('click', () => window.location.reload());

	// --- Mise à jour du jeu installé (service worker du PWA). ---
	// Le navigateur ne vérifie le service worker qu'en ouvrant la page ; une icône d'écran d'accueil
	// iOS reste souvent ouverte des jours : on vérifie donc aussi au retour au premier plan et toutes
	// les 30 minutes. La nouvelle version s'installe en arrière-plan ; pendant le chargement, on
	// l'applique tout de suite, ensuite on la propose (une partie en cours serait interrompue).
	const update = document.getElementById('if-update');
	let registration = null;
	let updateRequested = false;

	// Nouvelle version prête alors qu'une ancienne tournait déjà. Si la page n'était pas encore
	// contrôlée (première visite), le navigateur l'active aussitôt : un simple rechargement suffit.
	let updateReady = false;

	function hasUpdate() {
		return registration != null && (registration.waiting != null || updateReady);
	}

	function applyUpdate() {
		if (!hasUpdate() || updateRequested) {
			return;
		}
		updateRequested = true;
		update.style.display = 'none';
		if (registration.waiting != null) {
			// Le service worker de Godot répond à « update » : il s'active puis recharge les onglets.
			registration.waiting.postMessage('update');
			setTimeout(() => window.location.reload(), 4000);
		} else {
			window.location.reload();
		}
	}

	function offerUpdate() {
		if (!hasUpdate()) {
			return;
		}
		if (initializing) {
			applyUpdate();
		} else if (!updateRequested) {
			update.style.display = 'block';
		}
	}

	function watchRegistration(reg) {
		registration = reg;
		reg.addEventListener('updatefound', () => {
			const worker = reg.installing;
			// Première installation (aucune version active) : ce n'est pas une mise à jour.
			if (worker == null || reg.active == null) {
				return;
			}
			worker.addEventListener('statechange', () => {
				if (worker.state === 'installed' || worker.state === 'activated') {
					updateReady = true;
					offerUpdate();
				}
			});
		});
		offerUpdate();
	}

	function checkForUpdate() {
		if (registration != null && !updateRequested) {
			registration.update().then(offerUpdate).catch(() => {});
		}
	}

	if (GODOT_CONFIG['serviceWorker'] && 'serviceWorker' in navigator) {
		navigator.serviceWorker.addEventListener('controllerchange', () => {
			if (updateRequested) {
				setTimeout(() => window.location.reload(), 1500);
			}
		});
		// Vérifie aussi dès l'ouverture : le navigateur ne le fait pas toujours tout de suite.
		navigator.serviceWorker.ready.then((reg) => {
			watchRegistration(reg);
			checkForUpdate();
		}).catch(() => {});
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') {
				checkForUpdate();
			}
		});
		setInterval(checkForUpdate, 30 * 60 * 1000);
		document.getElementById('if-update-now').addEventListener('click', applyUpdate);
		document.getElementById('if-update-later').addEventListener('click', () => {
			update.style.display = 'none';
		});
	}

	// --- Démarrage (gabarit Godot 4.7). ---
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((reg) => {
					if (reg != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return reg;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Ce navigateur ne propose pas les fonctions nécessaires :\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		statusBar.classList.add('indeterminate');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusBar.classList.remove('indeterminate');
					statusBar.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
				} else {
					statusBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
